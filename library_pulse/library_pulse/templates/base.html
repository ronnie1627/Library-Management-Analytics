<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Library Pulse{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/plotly.min.js') }}"></script>
</head>
<body>
<button class="menu-toggle" aria-label="Toggle navigation">&#9776; Menu</button>
<div class="shell">
  <aside class="catalog">
    <div class="catalog-brand">
      <span class="call-number">025.5&nbsp;LIB</span>
      <h1>Library<br>Pulse</h1>
      <span class="tagline">circulation analytics</span>
    </div>
    <nav class="drawers">
      <a class="drawer {{ 'active' if active=='overview' }}" href="/">
        <span class="drawer-tab">A&ndash;C</span><span class="drawer-label">Overview</span>
      </a>
      <a class="drawer {{ 'active' if active=='members' }}" href="/members">
        <span class="drawer-tab">D&ndash;F</span><span class="drawer-label">Members</span>
      </a>
      <a class="drawer {{ 'active' if active=='trends' }}" href="/trends">
        <span class="drawer-tab">G&ndash;M</span><span class="drawer-label">Trends</span>
      </a>
      <a class="drawer {{ 'active' if active=='branches' }}" href="/branches">
        <span class="drawer-tab">N&ndash;R</span><span class="drawer-label">Branches</span>
      </a>
      <a class="drawer {{ 'active' if active=='insights' }}" href="/insights">
        <span class="drawer-tab">S&ndash;Z</span><span class="drawer-label">Insights</span>
      </a>
    </nav>
    <div class="catalog-footer">Synthetic dataset &middot; 2024&ndash;2025</div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
